[project]
name = "enterprise-digital-human"
version = "0.1.0"
description = "企业级实时交互数字人助手（backend）：听→想→说→演 自研编排"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "numpy>=1.26",
    "scipy>=1.12",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
