[project]
name = "enterprise-digital-human"
version = "0.1.0"
description = "企业级实时交互数字人助手（backend）：听→想→说→演 自研编排"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "numpy>=1.26",
    "scipy>=1.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "dashscope>=1.20",
    "websockets>=12.0",
]

[tool.pytest.ini_options]
# deploy/ 是云侧部署产物（lip_service / lip_encode），其编码器不依赖 torch/cv2，
# 故纳入 pythonpath 以便本机直接单测编码路径（云 GPU 关机时也能验）
pythonpath = ["src", "deploy"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
