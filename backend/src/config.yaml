# 配置中心（DESIGN §4.4）：模型供应商/参数集中管理
# api_key 一律从环境变量读取（api_key_env 字段指定），不落盘

asr:
  provider: modelscope            # 模型下载源（国内优先，DESIGN §5.4 坑 2）
  model: paraformer-zh-streaming  # 流式模型（离线版为 paraformer-zh）
  vad_model: fsmn-vad
  streaming: true
  chunk_size: [5, 10, 5]
  chunk_stride: 600

llm:
  provider: deepseek
  model: deepseek-chat
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY   # 从该环境变量读取 key
  fallback_model: null            # 本地兜底模型（P2 可选）

tts:
  provider: dashscope             # 云端优先（支持 word 时间戳）；开源 CosyVoice2 为备用路线
  model: cosyvoice-v2             # ⚠️ 必须是 v2：v1 不返回 word 时间戳（SPEC §4.3 前提）
  voice: longxiaochun_v2          # v2 音色（长小春女声）
  timestamp: true                 # word-level 时间戳开关（实测 v2 返回）
  first_packet_target_ms: 300     # 首包目标延迟（实测 660ms，未达标，见台账）
  output_sample_rate: 16000       # 链路统一基准；TTS 输出非 16k 由 tts 模块重采样（SPEC §2）

lip:
  model: musetalk
  fps: 25                         # 与 MuseTalk 训练口径一致
  batch_size: 4
  service_url: http://127.0.0.1:8002  # 云 GPU lip 推理服务（SPEC §2.1），经 SSH 隧道映射到本机
  # ⚠️ 必须写 127.0.0.1，不要写 localhost：本机 localhost 名字解析耗时 ~2 秒/次（实测见 RUNBOOK 坑 20），
  #    口型按分片调用时这个开销会直接叠加到音画偏差上
  mock: false                     # true=占位帧（无卡/无隧道联调）；false=真实云 GPU 推理
  transport: h264                 # h264=整句 H.264 片段（ADR-005 默认）| frames=逐帧 JPEG（P1 兼容，A/B 对照用）
  crf: 26                         # H.264 质量（越大越小越糊）；实测 8s 音频 CRF26≈387KB、CRF23≈663KB
  chunk_ms: 1000                  # ADR-006：口型按音频分片送推理的片长（毫秒）；1000=每秒一片
  min_tail_ms: 200                # 句尾残片短于此值不单独推理（省一次 GPU 占用）

cache:
  enabled: false                  # 高频回复缓存（P3 优化）
  similarity_threshold: 0.9

pipeline:
  overlap: true                   # true=按句流水线（LLM 未输出完即开始合成，DESIGN §3.1）
                                  # false=串行（整段回答后合成）；仅用于 A/B 对照实验

session:
  idle_timeout_s: 1800            # 会话闲置回收
